name: SOLIS-RD follow upstream

# Every day: if RustDesk has published a newer release, rebuild this branch
# from it with the SOLIS-RD branding and start a build. If upstream changed a
# line the branding expects, apply-solis-rd.sh stops and this run fails, and
# GitHub emails the repo owner; nothing half-branded is pushed.
#
# Needs secret SOLIS_PUSH_TOKEN: a fine-grained token for this repo with
# Contents and Workflows read/write. The built-in token cannot push changes to
# .github/workflows, and every upstream release touches them.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency: solis-rd-follow-upstream

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solis-rd
          token: ${{ secrets.SOLIS_PUSH_TOKEN }}

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/rustdesk/rustdesk/releases/latest --jq .tag_name)"
          current="$(cat solis/UPSTREAM_VERSION)"
          echo "upstream $latest, ours $current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.check.outputs.changed == 'true'
        run: solis/update-to-upstream.sh "${{ steps.check.outputs.latest }}"

      - if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "upstream: RustDesk ${{ steps.check.outputs.latest }} as SOLIS-RD"
          git push origin HEAD:solis-rd

      - if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run solis-rd-build.yml --repo "${{ github.repository }}" --ref solis-rd
